# Publishes the static browser demo to GitHub Pages (Pages source: GitHub Actions).
# If Pages is set to deploy the branch instead, the committed index.html + app/ serve the same site;
# refresh app/ with `cd frontend && npm run build:pages` after frontend changes.
# If the run fails at configure-pages: repo Settings → Pages → Source: "GitHub Actions", then re-run.
name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main, claude/nifty-brown-kl816p]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci && npm run build:pages
        working-directory: frontend
      # Same layout as the committed branch: root index.html → app/
      - run: mkdir -p _site && cp -r index.html .nojekyll app _site/
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
